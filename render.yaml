# ============================================================
# Render Blueprint - AI Competition Management System
# ============================================================
# Render automatically detects this file and configures the service.
# See: https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: ai-competition
    runtime: docker
    repo: https://github.com/ling0007/ai-competition-system.git
    plan: free
    healthCheckPath: /
    envVars:
      # ---- Database (Aiven MySQL) ----
      # Set these in Render Dashboard → Environment Variables
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
        sync: false
      - key: DB_NAME
        value: ai_competition_db
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
        sync: false

      # ---- JWT Secret ----
      # Generate a random string: openssl rand -hex 32
      - key: JWT_SECRET
        generateValue: true
        sync: false

      # ---- Spring Profile ----
      - key: SPRING_PROFILES_ACTIVE
        value: prod
        sync: false

      # ---- AI (DashScope) - Optional ----
      # Get API key from: https://dashscope.console.aliyun.com/apiKey
      - key: DASHSCOPE_API_KEY
        sync: false

      # ---- JVM Options ----
      # 512MB heap required for PDF rendering (PDFBox + base64 encoding)
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms128m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+ExitOnOutOfMemoryError"
        sync: false
