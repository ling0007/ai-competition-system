spring.application.name=aicompetition

# MySQL datasource — all connection parameters driven by environment variables
# Default values suitable for local development; override via env vars for production
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_competition_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.encoding=UTF-8
spring.flyway.clean-disabled=true

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ============================================================
# LLM Configuration - DashScope (OpenAI-compatible API)
# ============================================================
llm.api.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.api.key=${DASHSCOPE_API_KEY:}
llm.api.model=qwen3.7-flash
llm.api.temperature=0.1
llm.api.max-tokens=2048
# Multimodal model for PDF OCR (image-based PDFs that Tika cannot extract)
# Keep OCR and text processing on the same qwen3.7-flash model unless an
# environment-specific profile explicitly overrides this property.
llm.api.vision-model=qwen3.7-flash
llm.api.vision-max-tokens=4096

# Phase 6.3 scanned PDF bounds, tuned to the versioned 10-page sample.
ai.ocr.max-bytes=${AI_OCR_MAX_BYTES:20971520}
ai.ocr.max-pages=${AI_OCR_MAX_PAGES:20}
ai.ocr.batch-size=${AI_OCR_BATCH_SIZE:2}
ai.ocr.concurrency=${AI_OCR_CONCURRENCY:2}
ai.ocr.page-timeout-seconds=${AI_OCR_PAGE_TIMEOUT_SECONDS:60}
ai.ocr.max-vision-calls=${AI_OCR_MAX_VISION_CALLS:40}

# Notice AI: durable PENDING tasks, bounded local execution, 5 minute total deadline.
ai.executor.core-size=${AI_CORE_SIZE:2}
ai.executor.max-size=${AI_MAX_SIZE:3}
ai.executor.queue-capacity=${AI_QUEUE_CAPACITY:16}
material.ai.task-timeout-seconds=${MATERIAL_AI_TASK_TIMEOUT_SECONDS:600}
notice.ai.task-timeout-seconds=${NOTICE_AI_TASK_TIMEOUT_SECONDS:300}
notice.ai.recovery-scan-ms=${NOTICE_AI_RECOVERY_SCAN_MS:5000}

# ============================================================
# File upload size limits
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ============================================================
# Redis Configuration
# Redis 不可用时系统自动降级为查数据库，不影响核心业务流程
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
dashboard.cache.ttl-seconds=${DASHBOARD_CACHE_TTL_SECONDS:120}
material.upload.lock-ttl-seconds=${MATERIAL_UPLOAD_LOCK_TTL_SECONDS:120}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.timeout=5000ms

# ============================================================
# JWT Configuration — required in every real runtime via environment variable
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
