# ============================================================
# Production Configuration
# Activated by: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# Disable SQL logging in production (performance)
mybatis-plus.configuration.log-impl=

# JWT — must be provided via JWT_SECRET environment variable in production
jwt.secret=${JWT_SECRET}

# Server
server.port=${PORT:8080}

# Shutdown gracefully
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Disable Flyway validation in production (schema managed by migrations)
spring.flyway.validate-on-migrate=false

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
