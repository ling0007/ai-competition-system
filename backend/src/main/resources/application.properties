spring.application.name=aicompetition

# MySQL datasource — all connection parameters driven by environment variables
# Default values suitable for local development; override via env vars for production
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_competition_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.encoding=UTF-8
spring.flyway.clean-disabled=true

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================================
# LLM Configuration - DashScope (OpenAI-compatible API)
# ============================================================
llm.api.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.api.key=${DASHSCOPE_API_KEY}
llm.api.model=qwen-turbo
llm.api.temperature=0.1
llm.api.max-tokens=2048
# Vision model for PDF OCR (image-based PDFs that Tika cannot extract)
# If 401, check: 1) DashScope console → vision model enabled, 2) model name still valid
# Alternatives: qwen-vl-max-latest, qwen-vl-plus, qwen2.5-vl-72b-instruct
llm.api.vision-model=qwen-vl-max
llm.api.vision-max-tokens=4096

# ============================================================
# File upload size limits
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=ai-competition-jwt-secret-key-2026-spring-boot
jwt.expiration=86400000
