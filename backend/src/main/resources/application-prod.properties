# ============================================================
# Production Configuration (activated by SPRING_PROFILES_ACTIVE=prod)
# Database: Aiven MySQL (SSL required)
# ============================================================

# Disable SQL logging in production (performance)
mybatis-plus.configuration.log-impl=

# JWT — must be provided via JWT_SECRET environment variable in production
jwt.secret=${JWT_SECRET}

# Server
server.port=${PORT:8080}

# Shutdown gracefully
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Flyway — standard MySQL configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.encoding=UTF-8

# HikariCP — connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging
logging.level.org.springframework.boot=INFO
logging.level.org.flywaydb=INFO
