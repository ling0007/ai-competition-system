# ============================================================
# Production Configuration
# Activated by: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# Disable SQL logging in production (performance)
mybatis-plus.configuration.log-impl=

# JWT — must be provided via JWT_SECRET environment variable in production
jwt.secret=${JWT_SECRET}

# Server
server.port=${PORT:8080}

# Shutdown gracefully
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Disable Flyway validation in production (schema managed by migrations)
spring.flyway.validate-on-migrate=false

# Temporarily disable Flyway to debug TiDB compatibility
spring.flyway.enabled=false

# Debug logging for startup diagnostics
logging.level.org.springframework.boot=INFO
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.flywaydb=DEBUG

# HikariCP — extended timeouts for cross-region TiDB connection
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
